<script>
  (async function() {
    // 1. Paste your 64-character SHA-256 hash here (NOT the clear text password!)
    const targetHash = "1c2341a758d2d56d139b7dbcbed46b841a4e7476cd0cec55ad380eef28c059d9"; 

    // Helper function to calculate SHA-256 using built-in browser crypto API
    async function hashString(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Prompt user
    const userInput = prompt("This map is password protected. Please enter the password to view:");

    if (userInput) {
      const userHash = await hashString(userInput);
      if (userHash === targetHash) {
        return; // Password matches! Allow map to load normally.
      }
    }

    // Block access if password was wrong or cancelled
    alert("Incorrect password! Access denied.");
    document.write("<h2 style='font-family:sans-serif; text-align:center; margin-top:20%; color:#d9534f;'>Access Denied: Invalid Password</h2>");
    window.stop();
  })();
</script>

        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() { popup.update(); });
                            img.addEventListener('error', function() { popup.update(); });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    video.addEventListener('loadedmetadata', function() { popup.update(); });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }

                popup._contentNode.classList.remove('media');
            }

        // --- 2. DEFINE FUNCTIONS ---

        var Filters = {"Year": "str", "Habitat": "str", "Severity": "str", "Cause": "str"};

       function drawPureCanvasChart(activeFeatures) {
    const canvas = document.getElementById('fireChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width;  // 1200px
    const h = canvas.height; // 1000px

    // Reset Canvas background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);

    // Determine field to group by
    const groupBySelect = document.getElementById('chartGroupBy');
    const groupByField = groupBySelect ? groupBySelect.value : 'Severity';

    // Count occurrences
    const counts = {};
    activeFeatures.forEach(function(f) {
        var val = f.properties[groupByField] || 'Unknown';
        counts[val] = (counts[val] || 0) + 1;
    });

    const categories = Object.keys(counts);
    if (categories.length === 0) {
        ctx.fillStyle = '#666666';
        ctx.font = 'bold 40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No data available', w / 2, h / 2);
        return;
    }

    // Title (Larger font for clear sidebar preview)
    ctx.fillStyle = '#333333';
    ctx.font = 'bold 52px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Incidents by ' + groupByField, w / 2, 80);

    // Color mapping for Severity + fallback palette for other attributes
    const severityColors = {
        'Minor': '#e5cd1f',    // Yellow
        'Moderate': '#ff7f00', // Orange
        'Severe': '#db1e2a'    // Red
    };
    const defaultPalette = ['#0275d8', '#5cb85c', '#5bc0de', '#f0ad4e', '#9c27b0', '#e91e63'];

    const maxVal = Math.max(...Object.values(counts), 1);
    
    // Adjusted layout boundaries to make room for larger x-axis labels
    const chartTop = 180;
    const chartBottom = h - 220; 
    const chartHeight = chartBottom - chartTop;

    const sideMargin = 100;
    const availableWidth = w - (sideMargin * 2);
    const barWidth = Math.max(50, Math.floor(availableWidth / categories.length) - 40);
    const totalSpacing = availableWidth - (barWidth * categories.length);
    const gap = categories.length > 1 ? totalSpacing / (categories.length - 1) : 0;

    categories.forEach(function(label, i) {
        const val = counts[label];
        const x = sideMargin + i * (barWidth + gap);
        const barH = (val / maxVal) * (chartHeight - 80);
        const y = chartBottom - barH;

        // Assign exact color if Severity, otherwise pick from palette
        if (groupByField === 'Severity' && severityColors[label]) {
            ctx.fillStyle = severityColors[label];
        } else {
            ctx.fillStyle = defaultPalette[i % defaultPalette.length];
        }

        // Draw Bar
        ctx.fillRect(x, y, barWidth, barH);

        // Value above bar
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 44px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(val, x + barWidth / 2, y - 20);

        // Label below bar
        const displayLabel = label.length > 14 ? label.substring(0, 12) + '…' : label;
        ctx.save();
        ctx.font = 'bold 42px sans-serif';
        ctx.fillStyle = '#222222';
        ctx.translate(x + barWidth / 2, chartBottom + 60);

        // Slant text if there are many categories
        if (categories.length > 4) {
            ctx.rotate(-Math.PI / 5);
            ctx.textAlign = 'right';
        } else {
            ctx.textAlign = 'center';
        }

        ctx.fillText(displayLabel, 0, 0);
        ctx.restore();
    });
}

        function filterFunc() {
            var allActiveFeatures = [];

            map.eachLayer(function(lyr){
                if ("options" in lyr && "dataVar" in lyr["options"]){
                    var features = this[lyr["options"]["dataVar"]].features.slice(0);
                    try{
                        for (var key in Filters){
                            var keyS = key.replace(/[^a-zA-Z0-9_]/g, "");
                            if (Filters[key] == "str" || Filters[key] == "bool"){
                                var selection = [];
                                var selEl = document.getElementById("sel_" + keyS);
                                if (!selEl) continue;
                                var options = selEl.options;
                                for (var i=0; i < options.length; i++) {
                                    if (options[i].selected && options[i].value !== "") {
                                        selection.push(options[i].value);
                                    }
                                }
                                try{
                                    if (key in features[0].properties){
                                        for (var j = features.length - 1; j >= 0; --j){
                                            if (selection.length > 0 && selection.indexOf(String(features[j].properties[key])) < 0) {
                                                features.splice(j, 1);
                                            }
                                        }
                                    }
                                } catch(err){}
                            }
                        }
                    } catch(err){}

                    this[lyr["options"]["layerName"]].clearLayers();
                    this[lyr["options"]["layerName"]].addData(features);

                    if (lyr["options"]["layerName"] !== 'layer_WicklowMountainsSAC_1') {
                        allActiveFeatures = allActiveFeatures.concat(features);
                    }
                }
            });

            drawPureCanvasChart(allActiveFeatures);
        }

        document.getElementById('downloadChartBtn').addEventListener('click', function() {
            const canvas = document.getElementById('fireChart');
            const link = document.createElement('a');
            link.download = 'filtered_fire_graph.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // --- 3. RUN INITIAL FILTER (AFTER DOM ELEMENTS EXIST) ---
        filterFunc();
        </script>
