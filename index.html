<script>
  (async function() {
    // 1. Paste your 64-character SHA-256 hash here (NOT the clear text password!)
    const targetHash = "1c2341a758d2d56d139b7dbcbed46b841a4e7476cd0cec55ad380eef28c059d9"; 

    // Helper function to calculate SHA-256 using built-in browser crypto API
    async function hashString(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Prompt user
    const userInput = prompt("This map is password protected. Please enter the password to view:");

    if (userInput) {
      const userHash = await hashString(userInput);
      if (userHash === targetHash) {
        return; // Password matches! Allow map to load normally.
      }
    }

    // Block access if password was wrong or cancelled
    alert("Incorrect password! Access denied.");
    document.write("<h2 style='font-family:sans-serif; text-align:center; margin-top:20%; color:#d9534f;'>Access Denied: Invalid Password</h2>");
    window.stop();
  })();
</script>

        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }

                    if (options[i].selected) selection.push(options[i].value);

                        for (i = features.length - 1;

                          && selection.length>0) {
                          features.splice(i,1);
                          }
                        }
                      }
                    } catch(err){
                  }
                }
              }

            }

            div_Severity.appendChild(lab_Severity);

            sel_Severity = document.createElement('select');
            sel_Severity.multiple = true;
            sel_Severity.size = 3;
            sel_Severity.id = "sel_Severity";
            sel_Severity.onchange = function(){filterFunc()};

            var Severity_options_str = "";
            Severity_options_str += '<option value="Minor">Minor</option>';
            Severity_options_str += '<option value="Moderate">Moderate</option>';
            Severity_options_str += '<option value="Severe">Severe</option>';
            sel_Severity.innerHTML = Severity_options_str;
            div_Severity.appendChild(sel_Severity);

            var reset_Severity = document.createElement('div');
            reset_Severity.innerHTML = 'clear filter';
            reset_Severity.className = 'filterlabel';
            reset_Severity.onclick = function() {
                var options = document.getElementById("sel_Severity").options;
                for (var i=0; i < options.length; i++) {
                    options[i].selected = false;
                }
                filterFunc();
            };
            div_Severity.appendChild(reset_Severity);
        </script>        
    </body>
</html>
